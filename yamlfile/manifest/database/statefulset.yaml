apiVersion: apps/v1  
kind: StatefulSet  
metadata:  
  name: postgres  
  namespace: database  
spec:  
  serviceName: postgres  
  replicas: 1  
  selector:  
    matchLabels:  
      app: postgres  
  template:  
    metadata:  
      labels:  
        app: postgres  
    spec:  
      securityContext:  
        fsGroup: 999  
      initContainers:  
        - name: init-permissions  
          image: busybox:1.36  
          command:  
            - sh  
            - -c  
            - |  
              chown -R 999:999 /var/lib/postgresql/data  
              chmod 700 /var/lib/postgresql/data  
          securityContext:  
            runAsUser: 0  
            runAsGroup: 0  
            allowPrivilegeEscalation: false  
            capabilities:  
              add:  
                - CHOWN  
                - FOWNER  
          volumeMounts:  
            - name: postgres-data  
              mountPath: /var/lib/postgresql/data  
      containers:  
        - name: postgres  
          image: postgres:16  
          ports:  
            - name: postgres  
              containerPort: 5432  
          env:  
            - name: POSTGRES_USER  
              value: postgres_admin  
            - name: POSTGRES_PASSWORD  
              valueFrom:  
                secretKeyRef:  
                  name: postgres-credentials  
                  key: POSTGRES_PASSWORD  
            - name: POSTGRES_DB 
              value: postgres  
          securityContext:  
            runAsNonRoot: true  
            runAsUser: 999  
            runAsGroup: 999  
            allowPrivilegeEscalation: false  
            capabilities:  
              drop:  
                - ALL  
          resources:  
            requests:  
              cpu: "100m"  
              memory: "256Mi"  
            limits:  
              cpu: "500m"  
              memory: "512Mi"  
          volumeMounts:  
            - name: postgres-data  
              mountPath: /var/lib/postgresql/data  
  volumeClaimTemplates:  
    - metadata:  
        name: postgres-data  
      spec:  
        accessModes:  
          - ReadWriteOnce  
        resources:  
          requests:  
            storage: 10Gi 
