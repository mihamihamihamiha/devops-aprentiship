apiVersion: v1  
kind: Pod  
metadata:  
  name: postgres-restore  
  namespace: database  
spec:  
  restartPolicy: Never  
  containers:  
    - name: restore  
      image: postgres:16  
      env:  
        - name: PGHOST  
          value: postgres  
        - name: PGPORT  
          value: "5432"  
        - name: PGUSER  
          value: postgres_admin  
        - name: PGPASSWORD  
          valueFrom:  
            secretKeyRef:  
              name: postgres-credentials  
              key: POSTGRES_PASSWORD  
      command: 
        - /bin/sh 
        - -c 
        - | 
          while true; do 
            sleep 3600 
          done  
      resources:  
        requests:  
          cpu: "50m"  
          memory: "128Mi"  
        limits:  
          cpu: "200m"  
          memory: "256Mi"  
      securityContext:  
        runAsNonRoot: true  
        runAsUser: 999  
        runAsGroup: 999  
        allowPrivilegeEscalation: false  
        capabilities:  
          drop:  
            - ALL  
      volumeMounts:  
        - name: backup-storage  
          mountPath: /backups  
  volumes:  
    - name: backup-storage  
      persistentVolumeClaim:  
        claimName: postgres-backups 
